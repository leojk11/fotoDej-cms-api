[build]
  # nothing to build, the API runs as a Netlify Function. `public` only holds a placeholder page
  publish = "public"

[build.environment]
  # the DB username equals the GitHub username in package.json's repository URLs, which trips the secrets scan
  SECRETS_SCAN_OMIT_KEYS = "DB_USERNAME,PORT"

[functions]
  directory = "netlify/functions"
  # the bundled app require()s its dependencies at runtime, which Netlify's file tracing misses, so ship them all
  # (includes bcrypt's prebuilt native binaries)
  included_files = ["node_modules/**", "!node_modules/nodemon/**"]
